<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Wishes 💗</title>

    <style>

        * {
            box-sizing: border-box;  /*its for giving the size (universal selector)*/
        }

        body {
            margin: 0;     /*body k arount default gap*/
            min-height: 100vh; /* screen jitni heigth*/

            background:
                radial-gradient(circle at 10% 20%, #c8edc5 0 12%, transparent 13%),/* circular decorative effect*/
                radial-gradient(circle at 90% 80%, #b8e3b5 0 15%, transparent 16%),
                #dff5d9; /*mint green*/

            font-family: "Comic Sans MS", "Segoe UI", sans-serif;

            display: flex; 
            justify-content: center; /*horizontaly center*/
            align-items: center; /*vertically center*/

            overflow: hidden;
        }


        /* Small decorative hearts */

        .heart {
            position: absolute;
            color: #496b4d;
            font-size: 22px;
            opacity: 0.8;
        }

        .h1 { top: 8%; left: 15%; transform: rotate(-15deg); }
        .h2 { top: 18%; right: 14%; transform: rotate(20deg); }
        .h3 { bottom: 15%; left: 12%; transform: rotate(15deg); }
        .h4 { bottom: 8%; right: 18%; transform: rotate(-20deg); }
        .h5 { top: 10%; right: 40%; }


        /* Main scrapbook */

        .scrapbook {
            width: 90%;
            max-width: 1000px;
            min-height: 650px;

            position: relative;

            padding: 70px 80px;

            border-radius: 35px;

            background: rgba(255,255,255,0.18);

            box-shadow:
                0 20px 50px rgba(65, 100, 65, 0.18);

            border: 2px solid rgba(255,255,255,0.6);
        }


        /* Little notes */

        .note {
            position: absolute;

            background: #fffdf0;

            padding: 14px 18px;

            color: #4b5946;

            font-size: 14px;

            box-shadow: 3px 5px 10px rgba(0,0,0,0.12);

            transform: rotate(-6deg);
        }

        .note1 {
            left: 25px;
            top: 80px;
        }

        .note2 {
            right: 30px;
            top: 120px;
            transform: rotate(7deg);
        }

        .note3 {
            left: 45px;
            bottom: 90px;
            transform: rotate(5deg);
        }


        /* Birthday tag */

        .tag {
            position: absolute;

            right: 25px;
            top: 30px;

            width: 90px;

            padding: 18px 8px;

            background: #fff7e9;

            border: 1px solid #777;

            text-align: center;

            font-size: 13px;

            transform: rotate(8deg);

            box-shadow: 3px 5px 10px rgba(0,0,0,0.15);
        }


        /* Browser */

        .browser {
            width: 100%;
            max-width: 650px;

            margin: auto;

            background: #f7f8e9;

            border: 2px solid #4c5849;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 15px 30px rgba(55,80,55,0.2);

            animation: appear 1s ease;
        }


        /* Browser top */

        .browser-top {
            height: 42px;

            background: #dcebd3;

            border-bottom: 2px solid #4c5849;

            display: flex;

            align-items: center;

            padding: 0 12px;
        }


        .circle {
            width: 13px;
            height: 13px;

            border-radius: 50%;

            border: 1px solid #555;

            margin-right: 7px;
        }


        .red {
            background: #f4a6a6;
        }

        .yellow {
            background: #f4d58d;
        }

        .green {
            background: #a8d5a2;
        }


        .browser-title {
            margin-left: auto;
            margin-right: 15px;

            font-size: 13px;
            color: #52624f;
        }


        /* Content */

        .content {
            min-height: 360px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            position: relative;

            padding: 40px;
        }


        .tiny-heart {
            font-size: 25px;
            color: #557b57;

            margin-bottom: 8px;
        }


        h1 {
            margin: 5px 0 15px;

            font-size: 34px;

            color: #263d2a;

            font-weight: 600;
        }


        p {
            margin: 5px;

            color: #4b594c;

            font-size: 16px;

            line-height: 1.7;
        }


        /* Button */

        button {
            margin-top: 25px;

            padding: 11px 30px;

            border-radius: 25px;

            border: 2px solid #506a54;

            background: #c9e8c5;

            color: #344c37;

            font-family: inherit;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {          /*pseudo class agr mouse ka button waha jayega to wo big ho jayega*/
            transform: scale(1.08);

            background: #b3dcb0;

            box-shadow: 0 5px 15px rgba(50,80,50,0.2);
        }


        /* Bottom page text */

        .page {
            text-align: center;

            margin-top: 25px;

            color: #536653;

            font-size: 13px;

            letter-spacing: 2px;
        }


        /* Cute cat */

        .cat {
            position: absolute;

            right: -38px;
            bottom: 40px;

            font-size: 65px;

            transform: rotate(-5deg);
        }


        /* Floating decorations */

        .sparkle {
            position: absolute;

            color: #506b51;

            font-size: 20px;
        }

        .s1 {
            left: 20%;
            top: 30%;
        }

        .s2 {
            right: 18%;
            bottom: 30%;
        }


        @keyframes appear {  /*browser ka opening animation*/

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* Mobile */

        @media(max-width: 700px) {

            .scrapbook {   /*width of scapping decrease from inside in mobile*/ 
                padding: 50px 15px;
                width: 94%;
            }

            .note,
            .tag {
                display: none;  /*hide tage and notes in monile*/
            }

            .browser {
                width: 100%;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 14px;
            }

            .cat {
                font-size: 45px;
                right: -5px;
                bottom: 15px;
            }

        }

    </style>
</head>


<body>


    <!-- Decorative elements -->

    <div class="heart h1">♡</div> <!--class call krne ka tareeka-->
    <div class="heart h2">♡</div>
    <div class="heart h3">♡</div>
    <div class="heart h4">♡</div>
    <div class="heart h5">♡</div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>


    <div class="scrapbook">


        <!-- Side notes -->

        <div class="note note1">
            A small<br>
            surprise<br>
            for a<br>
            special person ♡
        </div>


        <div class="note note2">
            ♡ Just for you ♡
        </div>


        <div class="note note3">
            Good<br>
            Things<br>
            Take Time ♡
        </div>


        <!-- Browser window -->

        <div class="browser">


            <div class="browser-top">

                <div class="circle red"></div>
                <div class="circle yellow"></div>
                <div class="circle green"></div>

                <div class="browser-title">
                    ♡ just for you ♡
                </div>

            </div>


            <div class="content">


                <div class="tiny-heart">
                    ♡
                </div>


                <h1>
                    Hey, Akrumaan 👀
                </h1>

                <p>
                    Don't think too much...<br>
                    Just enjoy my coding! ♡
                </p>


                
                <button onclick="nextPage()">
                    Continue&nbsp; → 
                </button>


                <div class="cat">
                    🐱
                </div>

            </div>

        </div>


        <div class="page">
            ── ♡ PAGE 1 OF 6 ♡ ──
        </div>


    </div>


    <script>

        function nextPage() {

            window.location.href="2nd.html"

        }

    </script>


</body>
</html>
