<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>catch game 💗</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at 10% 20%, #c8edc5 0 12%, transparent 13%),
                radial-gradient(circle at 90% 80%, #b8e3b5 0 15%, transparent 16%),
                #dff5d9;

            font-family: "Comic Sans MS", "Segoe UI", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* Decorative hearts */

        .decoration {
            position: absolute;
            color: #496b4d;
            font-size: 22px;
        }

        .d1 {
            top: 8%;
            left: 15%;
        }

        .d2 {
            top: 18%;
            right: 15%;
        }

        .d3 {
            bottom: 12%;
            left: 15%;
        }

        .d4 {
            bottom: 10%;
            right: 18%;
        }


        /* Main scrapbook */

        .scrapbook {
            width: 90%;
            max-width: 1000px;
            min-height: 650px;

            position: relative;

            padding: 70px 80px;

            border-radius: 35px;

            background: rgba(255,255,255,0.18);

            border: 2px solid rgba(255,255,255,0.7);

            box-shadow:
                0 20px 50px rgba(65,100,65,0.18);
        }


        /* Side note */

        .note {
            position: absolute;

            left: 30px;
            top: 100px;

            padding: 15px 18px;

            background: #fffbea;

            color: #4d5d4b;

            font-size: 14px;

            line-height: 1.5;

            box-shadow:
                3px 5px 10px rgba(0,0,0,0.12);

            transform: rotate(-6deg);
        }


        /* Birthday tag */

        .tag {
            position: absolute;

            right: 25px;
            top: 35px;

            width: 90px;

            padding: 15px 8px;

            background: #fff7e9;

            border: 1px solid #777;

            text-align: center;

            font-size: 13px;

            transform: rotate(8deg);

            box-shadow:
                3px 5px 10px rgba(0,0,0,0.15);
        }


        /* Browser window */

        .browser {
            width: 100%;
            max-width: 650px;

            margin: auto;

            background: #f7f8e9;

            border: 2px solid #4c5849;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 15px 30px rgba(55,80,55,0.2);
        }


        /* Browser top */

        .browser-top {
            height: 42px;

            background: #dcebd3;

            border-bottom: 2px solid #4c5849;

            display: flex;

            align-items: center;

            padding: 0 12px;
        }


        .circle {
            width: 13px;
            height: 13px;

            border-radius: 50%;

            border: 1px solid #555;

            margin-right: 7px;
        }

        .red {
            background: #f4a6a6;
        }

        .yellow {
            background: #f4d58d;
        }

        .green {
            background: #a8d5a2;
        }


        .browser-title {
            margin-left: auto;
            margin-right: 15px;

            font-size: 13px;

            color: #52624f;
        }


        /* Game content */

        .content {
            min-height: 390px;

            position: relative;

            padding: 35px;

            text-align: center;
        }


        .small-heart {
            font-size: 25px;

            color: #557b57;

            margin-bottom: 5px;
        }


        h1 {
            margin: 5px 0 8px;

            color: #263d2a;

            font-size: 30px;
        }


        .instruction {
            color: #4b594c;

            font-size: 16px;

            margin-bottom: 5px;
        }


        .counter {
            color: #657565;

            font-size: 14px;

            margin-bottom: 10px;
        }


        /* Message which changes after every click */

        #gameMessage {
            position: absolute;

            left: 50%;
            top: 45%;

            transform: translateX(-50%);

            min-width: 150px;

            color: #536653;

            font-size: 14px;

            transition: 0.3s;
        }


        /* Moving heart */

        #heart {
            position: absolute;

            font-size: 48px;

            cursor: pointer;

            user-select: none;

            transition:
                left 0.35s ease,
                top 0.35s ease,
                transform 0.2s ease;

            left: 45%;
            top: 58%;
        }


        #heart:hover {
            transform: scale(1.15);
        }


        /* Final message */

        #finalMessage {
            display: none;

            margin-top: 190px;

            color: #4b594c;

            font-size: 19px;

            font-weight: bold;
        }


        /* Continue button */

        #continueBtn {
            display: none;

            margin-top: 15px;

            padding: 11px 28px;

            border-radius: 25px;

            border: 2px solid #506a54;

            background: #c9e8c5;

            color: #344c37;

            font-family: inherit;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s;
        }


        #continueBtn:hover {
            transform: scale(1.08);

            background: #b3dcb0;
        }


        /* Page number */

        .page {
            text-align: center;

            margin-top: 25px;

            color: #536653;

            font-size: 13px;

            letter-spacing: 2px;
        }


        /* Mobile */

        @media(max-width: 700px) {

            .scrapbook {
                padding: 50px 15px;

                width: 94%;
            }

            .note,
            .tag {
                display: none;
            }

            h1 {
                font-size: 25px;
            }

            .content {
                min-height: 390px;

                padding: 25px 15px;
            }

        }

    </style>

</head>


<body>


    <!-- Decorative hearts -->

    <div class="decoration d1">♡</div>

    <div class="decoration d2">♡</div>

    <div class="decoration d3">✦</div>

    <div class="decoration d4">♡</div>


    <div class="scrapbook">


        <!-- Side note -->

        <div class="note">

            First catch<br>
            my heart ♡

        </div>



        <!-- Browser -->

        <div class="browser">


            <!-- Browser top -->

            <div class="browser-top">

                <div class="circle red"></div>

                <div class="circle yellow"></div>

                <div class="circle green"></div>

                <div class="browser-title">
                    ♡ just for you ♡
                </div>

            </div>


            <!-- Game -->

            <div class="content">


                <div class="small-heart">
                    ♡
                </div>


                <h1>
                    First catch my heart 👀
                </h1>


                <div class="instruction">
                    Catch me if you can 😏
                </div>


                <div class="counter">
                    Caught 0 by 5
                </div>


                <!-- Changing message -->

                <div id="gameMessage"></div>


                <!-- Heart -->

                <div id="heart" onclick="moveHeart()">
                    ❤️
                </div>


                <!-- Final message -->

                <div id="finalMessage">
                    I am out of syllabus 😭💗
                </div>


                <!-- Continue -->

                <button id="continueBtn" onclick="nextPage()">
                    Continue →
                </button>


            </div>

        </div>


        <!-- Page number -->

        <div class="page">
            ── ♡ PAGE 2 OF 6 ♡ ──
        </div>


    </div>


    <script>

        let clicks = 0;


        const heart =
            document.getElementById("heart");

        const gameMessage =
            document.getElementById("gameMessage");

        const finalMessage =
            document.getElementById("finalMessage");

        const continueBtn =
            document.getElementById("continueBtn");


        function moveHeart() {

            clicks++;


            /* Messages for each attempt */

            const messages = [

                "Oops! 😭",

                "Try again 😏",

                "Aww... so close! 🥹",

                "You thought? 😂"

            ];


            /* Heart positions */

            const positions = [

                {
                    left: "70%",
                    top: "35%"
                },

                {
                    left: "25%",
                    top: "70%"
                },

                {
                    left: "75%",
                    top: "75%"
                },

                {
                    left: "15%",
                    top: "35%"
                }

            ];


            /* First 4 clicks */

            if (clicks <= 4) {

                gameMessage.innerHTML =
                    messages[clicks - 1];

                heart.style.left =
                    positions[clicks - 1].left;

                heart.style.top =
                    positions[clicks - 1].top;

            }


            /* Fifth click */

            else {

                heart.style.display = "none";

                gameMessage.style.display = "none";

                finalMessage.innerHTML =
                    "I am out of syllabus 😭💗";

                finalMessage.style.display =
                    "block";

                continueBtn.style.display =
                    "inline-block";

            }

        }


        /* Continue to Page 3 */

        function nextPage() {

            window.location.href =
                "3rd.html";

        }

    </script>


</body>

</html>
