<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Thing ♡</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#dff3d8;

    font-family:"Comic Sans MS","Segoe UI",sans-serif;

    overflow:hidden;
}


/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;

    border-radius:50%;

    background:#c6e6bf;

    opacity:.55;

    z-index:0;
}

.bg1{
    width:250px;
    height:250px;

    left:-90px;
    top:-60px;
}

.bg2{
    width:240px;
    height:240px;

    right:-90px;
    bottom:-60px;
}

.star{
    position:fixed;

    color:#71886b;

    font-size:25px;

    z-index:1;
}

.star1{
    top:12%;
    left:8%;
}

.star2{
    top:17%;
    right:9%;
}

.star3{
    bottom:14%;
    left:10%;
}

.star4{
    bottom:11%;
    right:12%;
}


/* =========================
   SCRAPBOOK
========================= */

.scrapbook{
    position:relative;

    z-index:2;

    width:90%;
    max-width:950px;

    min-height:650px;

    padding:65px 75px;

    background:#edf7e8;

    border:3px solid #657c61;

    border-radius:30px;

    box-shadow:
        0 11px 0 #b8ceb2,
        0 22px 45px rgba(60,85,60,.20);
}


/* =========================
   PAPER PIECES
========================= */

.paper{
    position:absolute;

    width:35px;
    height:35px;

    background:#fff9df;

    border:2px solid #77745f;
}

.paper.one{
    top:-13px;
    left:80px;

    transform:rotate(-8deg);
}

.paper.two{
    top:-12px;
    right:100px;

    transform:rotate(9deg);
}

.paper.three{
    bottom:-13px;
    left:120px;

    transform:rotate(8deg);
}

.paper.four{
    bottom:-13px;
    right:80px;

    transform:rotate(-7deg);
}


/* =========================
   NOTE
========================= */

.note{
    position:absolute;

    top:115px;
    left:18px;

    width:135px;

    padding:15px 10px;

    background:#fff9df;

    border:1px solid #89836d;

    color:#52634e;

    text-align:center;

    font-size:13px;

    line-height:1.5;

    box-shadow:
        4px 5px 9px rgba(0,0,0,.14);

    transform:rotate(-7deg);
}


/* =========================
   BROWSER
========================= */

.browser{
    width:100%;
    max-width:660px;

    margin:auto;

    background:#fffef7;

    border:2px solid #596653;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
        7px 9px 0 rgba(100,120,90,.20);
}


/* =========================
   BROWSER TOP
========================= */

.browser-top{
    height:44px;

    background:#d6e9d0;

    border-bottom:2px solid #596653;

    display:flex;

    align-items:center;

    padding:0 13px;
}

.dot{
    width:14px;
    height:14px;

    border-radius:50%;

    margin-right:7px;

    border:1px solid #596653;
}

.red{
    background:#f1a5a5;
}

.yellow{
    background:#f2d58e;
}

.green{
    background:#9bc798;
}

.browser-title{
    margin-left:auto;

    color:#596653;

    font-size:12px;
}


/* =========================
   CONTENT
========================= */

.content{
    position:relative;

    min-height:475px;

    padding:35px 20px;

    text-align:center;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


/* =========================
   HEART
========================= */

.small-heart{
    color:#658061;

    font-size:23px;

    margin-bottom:12px;
}


/* =========================
   IMAGE
========================= */

.photo-frame{

    width:300px;
    height:350px;

    padding:10px;

    background:#fff9df;

    border:2px solid #8a8b72;

    box-shadow:
        5px 6px 0 rgba(100,120,90,.18);

    transform:rotate(-1deg);

    display:flex;

    justify-content:center;

    align-items:center;
}

.photo-frame img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;
}


/* =========================
   FINAL MESSAGE
========================= */

.final-message{

    margin-top:25px;

    color:#263c29;

    font-size:25px;

    font-weight:600;

    line-height:1.4;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .scrapbook{
        width:94%;

        min-height:610px;

        padding:48px 10px;
    }

    .note{
        display:none;
    }

    .content{
        min-height:450px;

        padding:25px 5px;
    }

    .photo-frame{

        width:270px;
        height:205px;

    }

    .final-message{

        font-size:21px;

        margin-top:22px;
    }

    .paper{
        display:none;
    }
}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="bg bg1"></div>

<div class="bg bg2"></div>

<div class="star star1">♡</div>

<div class="star star2">✦</div>

<div class="star star3">♡</div>

<div class="star star4">✧</div>


<!-- =========================
     SCRAPBOOK
========================= -->

<div class="scrapbook">


    <!-- PAPER PIECES -->

    <div class="paper one"></div>

    <div class="paper two"></div>

    <div class="paper three"></div>

    <div class="paper four"></div>


    <!-- =========================
         SIDE NOTE
    ========================= -->

    <div class="note">

        One last memory<br>
        just for you ♡

    </div>


    <!-- =========================
         BROWSER
    ========================= -->

    <div class="browser">


        <!-- BROWSER TOP -->

        <div class="browser-top">

            <div class="dot red"></div>

            <div class="dot yellow"></div>

            <div class="dot green"></div>

            <div class="browser-title">

                just for you ♡

            </div>

        </div>


        <!-- =========================
             CONTENT
        ========================= -->

        <div class="content">


            <div class="small-heart">

                ♡

            </div>


            <!-- =========================
                 IMAGE
            ========================= -->

            <div class="photo-frame">

                <img
                    src="245134.jpeg"
                    alt="CUTIE>>>">

            </div>


            <!-- =========================
                 FINAL MESSAGE
            ========================= -->

            <div class="final-message">

                You were my favorite though. 🤍

            </div>


        </div>


    </div>


    <!-- =========================
         PAGE NUMBER
    ========================= -->

    <div class="page-number">

        ── ♡ PAGE 6 ♡ ──

    </div>


</div>


</body>
</html>
